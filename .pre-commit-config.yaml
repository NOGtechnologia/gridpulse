# Local quality gate (spec 7.6). Install: make install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(docs/openapi\.json|frontend/public/geo/)
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-format
        files: ^(backend|scripts)/
      - id: ruff
        files: ^(backend|scripts)/
        args: [--config=backend/pyproject.toml]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (changed backend files)
        entry: uv run --project backend --frozen mypy --config-file backend/pyproject.toml
        language: system
        types: [python]
        files: ^backend/src/
        pass_filenames: true
      - id: prettier
        name: prettier
        entry: pnpm --dir frontend exec prettier --check --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/(pnpm-lock\.yaml|public/geo/)
      - id: eslint
        name: eslint
        entry: pnpm --dir frontend exec eslint --max-warnings=0
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@19.8.1"]
