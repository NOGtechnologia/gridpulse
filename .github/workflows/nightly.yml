name: nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  verify-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Live check of all data sources (detects upstream API changes early)
        env:
          GRIDPULSE_ENTSOE_TOKEN: ${{ secrets.GRIDPULSE_ENTSOE_TOKEN }}
        run: uv run --project backend --frozen python scripts/tasks.py verify-sources

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: mutmut on domain/ (score >= 80 %)
        working-directory: backend
        run: |
          uv run --frozen --with mutmut==3.3.1 mutmut run || true
          uv run --frozen python ../scripts/mutation_score.py --min 80
