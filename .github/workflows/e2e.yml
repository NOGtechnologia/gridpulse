name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate visual baselines (commit them afterwards)"
        type: boolean
        default: false

permissions: read-all

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRIDPULSE_DEMO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start stack in demo mode (no internet needed by the app)
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Wait until demo data is seeded (worker seeds on start in demo mode)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/readyz && exit 0
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: Playwright + axe (+ visual regression)
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: pnpm exec playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - name: Lighthouse CI
        working-directory: frontend
        run: pnpm run lhci
      - name: Collect logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs > compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports
          path: |
            frontend/playwright-report
            frontend/tests/e2e/__screenshots__
            frontend/.lighthouseci
            compose.log
