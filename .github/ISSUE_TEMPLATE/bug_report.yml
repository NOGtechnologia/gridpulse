name: Bug report
description: Something is wrong or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please use private vulnerability reporting instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page/endpoint, the time (with time zone) and the affected data source.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs (remove tokens and personal data)
      render: shell
